name: Daily trending scrape

on:
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC ≈ 6–7 am in eastern Australia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero (and leaves data/trending.json untouched) if any period fails.
      - run: npm run scrape

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/trending.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending.json
          git commit -m "data: update trending $(date -u +%F)"
          git push
